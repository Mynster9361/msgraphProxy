name: Build Dev Proxy binaries

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "build/plugins-src/**"
            - "build/Build-DevProxyPackage.ps1"
            - "build/Test-DevProxyPackage.ps1"

jobs:
    build:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Build Dev Proxy packages
              shell: pwsh
              run: .\build\Build-DevProxyPackage.ps1 -Verbose

            - name: Upload packages
              uses: actions/upload-artifact@v7
              with:
                  name: devproxy-packages
                  path: package/*.zip
                  retention-days: 1

    test-windows:
        needs: build
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v7

            - name: Download packages
              uses: actions/download-artifact@v8
              with:
                  name: devproxy-packages
                  path: package

            - name: Smoke-test win-x64 package
              shell: pwsh
              run: .\build\Test-DevProxyPackage.ps1 -PackagePath .\package\msgraphproxy-devproxy-win-x64.zip

    test-linux:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Download packages
              uses: actions/download-artifact@v8
              with:
                  name: devproxy-packages
                  path: package

            - name: Smoke-test linux-x64 package
              shell: pwsh
              run: ./build/Test-DevProxyPackage.ps1 -PackagePath ./package/msgraphproxy-devproxy-linux-x64.zip

    test-macos:
        needs: build
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v7

            - name: Download packages
              uses: actions/download-artifact@v8
              with:
                  name: devproxy-packages
                  path: package

            - name: Smoke-test osx-arm64 package
              shell: pwsh
              run: ./build/Test-DevProxyPackage.ps1 -PackagePath ./package/msgraphproxy-devproxy-osx-arm64.zip

    publish:
        needs: [build, test-windows, test-linux, test-macos]
        runs-on: windows-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7

            - name: Download packages
              uses: actions/download-artifact@v8
              with:
                  name: devproxy-packages
                  path: package

            - name: Publish release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # --prerelease: build.yml's module release (vsts-release.ps1) is
                  # the one meant to be GitHub's "latest" release - it bundles
                  # these same binaries in with the published module version.
                  # Without --prerelease, this release would claim "latest" for
                  # itself the moment it's published, which carries no module
                  # content, and get bumped out of it again by the next module
                  # release anyway - neither of which Install-MsGraphProxy (which
                  # reads /releases/latest) should ever have to see.
                  $tag = "devproxy-$(Get-Date -Format yyyyMMdd-HHmmss)"
                  gh release create $tag .\package\*.zip --title $tag --notes "Automated Dev Proxy build with the msgraphProxy plugins (GraphSchemaMockPlugin, EntraTokenMockPlugin)."
