# Demonstrates running Maester (https://maester.dev) against msgraphProxy's
# mock instead of a real tenant. Results reflect schema-accurate but entirely
# FABRICATED data, not any real security posture, so this workflow doesn't
# fail the build on Maester's own pass/fail results - only on the
# proxy/connection/query plumbing itself failing outright.
name: Maester example (against msgraphProxy mock)

on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths:
            - "msgraphProxy/**"
            - "build/plugins-src/**"
            - ".github/workflows/maester-example.yml"

permissions:
    contents: read

jobs:
    run-maester-against-mock:
        name: Run Maester against the mock
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Start msgraphProxy in CI mode
              shell: pwsh
              run: |
                  # A real consumer would instead run:
                  #   Install-Module msgraphProxy -Scope CurrentUser -Force
                  Import-Module ./msgraphProxy/msgraphProxy.psd1 -Force
                  Install-MsGraphProxy
                  $result = Start-MsGraphProxy -CI -Confirm:$false
                  Write-Host "CertificateTrusted: $($result.CertificateTrusted)"

            - name: Connect to the mock and run Maester
              shell: pwsh
              run: |
                  Import-Module ./msgraphProxy/msgraphProxy.psd1 -Force
                  Import-Module Microsoft.Graph.Authentication -Force

                  # EntraTokenMockPlugin issues a well-formed JWT for any
                  # client_id/secret - no real app registration needed.
                  $tokenBody = @{
                      client_id     = 'test'
                      grant_type    = 'client_credentials'
                      client_secret = 'test'
                      scope         = 'https://graph.microsoft.com/.default'
                  }
                  $tokenResponse = Invoke-RestMethod -Method POST -Uri 'https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/oauth2/token' -Body $tokenBody -TimeoutSec 15
                  $secureToken = ConvertTo-SecureString $tokenResponse.access_token -AsPlainText -Force
                  Connect-MgGraph -AccessToken $secureToken -NoWelcome

                  Install-Module Maester -Scope CurrentUser -Force
                  Import-Module Maester -Force
                  # Separate from this repo's own ./tests (Pester suite) -
                  # Install-MaesterTests prompts if the target isn't empty.
                  Install-MaesterTests -Path ./maester-tests

                  # Scoped to Maester/Entra: the subset that actually calls
                  # Microsoft Graph, unlike Exchange/Teams/Purview/Intune etc.
                  $results = Invoke-Maester -Path ./maester-tests/Maester/Entra -OutputFolder test-results -OutputFolderFileName "test-results" -PassThru -NonInteractive

                  # Full test-results.json/.md can run into several MB across
                  # 700+ tests - past the step summary's 1MB cap and large
                  # enough to make artifact upload itself unreliable. Export
                  # a slim per-test summary instead.
                  $results.Tests |
                      Select-Object Id, Title, Result, Severity, Block, Duration, @{ Name = 'Tag'; Expression = { $_.Tag -join ', ' } } |
                      ConvertTo-Json -Depth 3 |
                      Set-Content -Path test-results/test-results-slim.json

                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @"
                  # Maester results (against msgraphProxy mock)

                  Total: $($results.TotalCount), Passed: $($results.PassedCount), Failed: $($results.FailedCount), Skipped: $($results.SkippedCount)

                  See the maester-test-results artifact for a per-test pass/fail/skip summary.
                  "@

                  Write-Host "Total: $($results.TotalCount), Passed: $($results.PassedCount), Failed: $($results.FailedCount), Skipped: $($results.SkippedCount)"

                  # Some Maester checks (DNS/SPF/DMARC) shell out to native
                  # tools that fail against the mock's fake domains, leaving
                  # $LASTEXITCODE non-zero with nothing after to reset it -
                  # which would otherwise fail this step despite no actual
                  # PowerShell error, and despite this workflow deliberately
                  # not gating on Maester's pass/fail results (see file header).
                  $global:LASTEXITCODE = 0

            - name: Stop msgraphProxy
              if: always()
              shell: pwsh
              run: |
                  Import-Module ./msgraphProxy/msgraphProxy.psd1 -Force
                  Stop-MsGraphProxy -Confirm:$false

            - name: Archive Maester test results
              uses: actions/upload-artifact@v7
              if: always()
              continue-on-error: true
              with:
                  name: maester-test-results
                  path: test-results/test-results-slim.json
