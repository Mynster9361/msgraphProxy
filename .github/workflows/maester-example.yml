# Demonstrates running Maester (https://maester.dev), a real, widely-used
# Entra/M365 security-testing framework, against msgraphProxy's mock instead
# of a real tenant - the flagship example of what this module is actually
# for: letting a module/test author exercise real Graph-calling PowerShell
# tooling in CI without a real app registration or tenant.
#
# IMPORTANT: results here reflect msgraphProxy's schema-accurate but entirely
# FABRICATED data, not any real security posture. Confirmed by actually
# running this: some Maester checks pass, some are sensibly skipped (e.g.
# checks requiring an Entra ID P1/P2 license, since the mock doesn't model
# licensing), some fail because fabricated cross-references naturally don't
# line up (e.g. a policy "referencing" a group id that isn't the same
# fabricated group another call returned), and a couple of checks bound to
# very specific real-API response shapes (What-If evaluation results, in
# particular) don't run cleanly against generic fabricated data. None of
# that is a real security finding - this workflow deliberately does not
# fail the build on Maester's own pass/fail results, only on the
# proxy/connection/query plumbing itself failing outright.
name: Maester example (against msgraphProxy mock)

on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths:
            - "msgraphProxy/**"
            - "build/plugins-src/**"
            - ".github/workflows/maester-example.yml"

permissions:
    contents: read

jobs:
    run-maester-against-mock:
        name: Run Maester against the mock
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Start msgraphProxy in CI mode
              shell: pwsh
              run: |
                  # Uses this repo's own module source directly, since this
                  # workflow is exercising msgraphProxy's current code. A
                  # real consumer in their own repo would instead run:
                  #   Install-Module msgraphProxy -Scope CurrentUser -Force
                  #   Import-Module msgraphProxy
                  Import-Module ./msgraphProxy/msgraphProxy.psd1 -Force
                  Install-MsGraphProxy
                  $result = Start-MsGraphProxy -CI -Confirm:$false
                  Write-Host "CertificateTrusted: $($result.CertificateTrusted)"

            - name: Connect to the mock and run Maester
              shell: pwsh
              run: |
                  Import-Module ./msgraphProxy/msgraphProxy.psd1 -Force
                  Import-Module Microsoft.Graph.Authentication -Force

                  # There's no real app registration to authenticate against -
                  # EntraTokenMockPlugin issues a self-signed, well-formed JWT
                  # for any client_id/secret, which is enough for the
                  # Microsoft Graph PowerShell SDK to accept via -AccessToken.
                  # (Connect-MgGraph -ClientSecretCredential also reaches the
                  # mocked token endpoint successfully, but its underlying
                  # MSAL token cache handling is unrelated to msgraphProxy and
                  # wasn't reliable in testing - -AccessToken sidesteps that
                  # entirely and is what's proven to work end-to-end.)
                  $tokenBody = @{
                      client_id     = 'test'
                      grant_type    = 'client_credentials'
                      client_secret = 'test'
                      scope         = 'https://graph.microsoft.com/.default'
                  }
                  $tokenResponse = Invoke-RestMethod -Method POST -Uri 'https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/oauth2/token' -Body $tokenBody -TimeoutSec 15
                  $secureToken = ConvertTo-SecureString $tokenResponse.access_token -AsPlainText -Force
                  Connect-MgGraph -AccessToken $secureToken -NoWelcome

                  Install-Module Maester -Scope CurrentUser -Force
                  Import-Module Maester -Force
                  # A separate, dedicated folder from this repo's own ./tests
                  # (which already holds this module's Pester suite) -
                  # Install-MaesterTests prompts interactively to confirm
                  # installing into a non-empty folder, which would otherwise
                  # hang/fail non-interactively in CI.
                  Install-MaesterTests -Path ./maester-tests

                  $results = Invoke-Maester -Path ./maester-tests -OutputFolder test-results -OutputFolderFileName "test-results" -PassThru -NonInteractive

                  # The full test-results.md can run into several MB, well
                  # past the step summary's 1MB cap (confirmed directly - a
                  # full-report write there aborts the step with a runner
                  # error, even though Maester itself succeeded) - so only a
                  # short recap goes to the step summary, and the full
                  # .json/.md reports are left for the "Archive Maester test
                  # results" step to upload as artifacts instead.
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @"
                  # Maester results (against msgraphProxy mock)

                  Total: $($results.TotalCount), Passed: $($results.PassedCount), Failed: $($results.FailedCount), Skipped: $($results.SkippedCount)

                  See the maester-test-results artifact for the full JSON/Markdown report.
                  "@

                  Write-Host "Total: $($results.TotalCount), Passed: $($results.PassedCount), Failed: $($results.FailedCount), Skipped: $($results.SkippedCount)"
                  # Deliberately not failing the build on $results.Result here -
                  # see the note at the top of this file for why that
                  # wouldn't mean what it means against a real tenant.

            - name: Stop msgraphProxy
              if: always()
              shell: pwsh
              run: |
                  Import-Module ./msgraphProxy/msgraphProxy.psd1 -Force
                  Stop-MsGraphProxy -Confirm:$false

            - name: Archive Maester test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: maester-test-results
                  path: |
                      test-results/*.json
                      test-results/*.md
